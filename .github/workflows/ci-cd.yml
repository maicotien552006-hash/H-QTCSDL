name: OISM CI/CD Pipeline (Build, Test, SQL Validate & Docker)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. T-SQL VALIDATION: Kiem tra toan ven CSDL tren Microsoft SQL Server 2022
  # ============================================================================
  sql-validation:
    name: 🛡️ Validate SQL Server 2022 Schema & Procedures
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Oism2026@StrongPassword!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Oism2026@StrongPassword!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⏱️ Wait for SQL Server 2022 readiness
        run: |
          echo "Waiting for SQL Server service container to become healthy..."
          sleep 10

      - name: 🛠️ Install sqlcmd on Ubuntu runner
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/microsoft.gpg
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo 'export PATH="$PATH:/opt/mssql-tools18/bin"' >> ~/.bashrc
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: 🚀 Execute SQLQuery1.sql (Schema, Partition, RLS, Indexes, Procedures)
        run: |
          sqlcmd -S 127.0.0.1 -U sa -P 'Oism2026@StrongPassword!' -C -i SQLQuery1.sql

      - name: 👥 Execute OISM_User_Accounts.sql
        run: |
          sqlcmd -S 127.0.0.1 -U sa -P 'Oism2026@StrongPassword!' -C -i OISM_User_Accounts.sql

      - name: 🗺️ Execute OISM_Spatial_GPS_Demo.sql
        run: |
          sqlcmd -S 127.0.0.1 -U sa -P 'Oism2026@StrongPassword!' -C -i OISM_Spatial_GPS_Demo.sql

      - name: 🧪 Run Automated Verification Queries (8 Advanced Features)
        run: |
          sqlcmd -S 127.0.0.1 -U sa -P 'Oism2026@StrongPassword!' -C -d OISM -Q "
            PRINT '--- 1. Testing Tenants Count ---';
            SELECT TenantId, Name FROM dbo.Tenants;
            PRINT '--- 2. Testing Spatial GIS Distance Function ---';
            SELECT BranchId, Name, Location.STDistance(geography::Point(10.7769, 106.7009, 4326)) AS DistanceFromBenThanh FROM dbo.Branches;
            PRINT '--- 3. Testing RLS Context Switching ---';
            EXEC sys.sp_set_session_context @key=N'TenantId', @value=1;
            SELECT COUNT(*) AS Tenant1_Branches FROM dbo.Branches;
            PRINT '--- 4. Testing Ledger Trigger Protection ---';
            SELECT TOP 3 * FROM dbo.InventoryLedger ORDER BY LedgerId DESC;
          "

  # ============================================================================
  # 2. BACKEND API BUILD: Bien dich ma nguon C# ASP.NET Core 8.0
  # ============================================================================
  backend-build:
    name: ⚙️ Build .NET 8 Web API
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Restore NuGet packages
        run: dotnet restore backend/backend.csproj

      - name: 🔨 Build Backend Release
        run: dotnet build backend/backend.csproj -c Release --no-restore

  # ============================================================================
  # 3. DOCKER BUILD & COMPOSE TEST: Kiem tra build container va khoi chay
  # ============================================================================
  docker-build-test:
    name: 🐳 Docker Build & Multi-Container Integration Test
    runs-on: ubuntu-latest
    needs: [sql-validation, backend-build]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔍 Validate docker-compose.yml configuration
        run: docker compose config

      - name: 🏗️ Build Docker Images
        run: docker compose build

      - name: 🚀 Start All Services via Docker Compose
        run: |
          docker compose up -d
          echo "Waiting 30 seconds for all containers to initialize and complete seeding..."
          sleep 30

      - name: 📊 Check running containers status
        run: docker compose ps

      - name: 🩺 Probe Frontend Web UI (Port 8080)
        run: |
          curl -sI http://localhost:8080 | head -n 5

      - name: 🩺 Probe Backend Health API (Port 5000)
        run: |
          curl -s http://localhost:5000/api/health || true

      - name: 🛑 Tear down containers
        if: always()
        run: docker compose down -v
